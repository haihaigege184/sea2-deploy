<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SEA2 · Web 打印</title>
<style>
  :root{
    --bg:#0b0f1a; --bg2:#121829; --card:#161d31; --card2:#1b2440;
    --line:#273150; --txt:#e8edf7; --mut:#8b97b5; --acc:#5b8cff; --acc2:#36d2a0;
    --warn:#ffb454; --err:#ff6b6b; --ok:#36d2a0;
    --grad:linear-gradient(135deg,#5b8cff 0%,#7b6bff 50%,#36d2a0 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, rgba(91,140,255,.10), transparent 60%), var(--bg);
    color:var(--txt);min-height:100vh;padding:24px 14px 60px;}
  .wrap{max-width:680px;margin:0 auto;}
  .hd{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 6px 20px rgba(91,140,255,.35)}
  .hd h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  .hd .sub{font-size:12px;color:var(--mut);margin-top:2px}
  .card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card h2{font-size:15px;margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card .desc{font-size:12.5px;color:var(--mut);margin:0 0 16px;line-height:1.6}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--mut);font-size:13px;cursor:pointer;transition:.2s;background:var(--bg2)}
  .drop.drag{border-color:var(--acc);color:var(--acc);background:rgba(91,140,255,.08)}
  .drop .big{font-size:15px;font-weight:700;margin-bottom:6px;color:var(--txt)}
  .file-info{margin-top:12px;font-size:12.5px;color:var(--mut);line-height:1.7}
  .file-info b{color:var(--acc)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
  label.fld{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
  select,input[type=text],input[type=number]{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;width:100%}
  select:focus,input:focus{border-color:var(--acc)}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);cursor:pointer;user-select:none}
  .btn{appearance:none;border:none;cursor:pointer;font-size:13.5px;font-weight:600;padding:11px 18px;border-radius:12px;background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(91,140,255,.3);transition:.15s}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);box-shadow:none}
  .note{font-size:12px;margin-top:12px;padding:8px 11px;border-radius:9px;line-height:1.6;display:none}
  .note.info{display:block;background:rgba(91,140,255,.12);color:var(--acc)}
  .note.ok{display:block;background:rgba(54,210,160,.12);color:var(--ok)}
  .note.err{display:block;background:rgba(255,107,107,.12);color:var(--err)}
  .task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg2);margin-bottom:10px}
  .task .st{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--card2);color:var(--mut);border:1px solid var(--line);flex:0 0 auto}
  .task .st.done{color:var(--ok);border-color:rgba(54,210,160,.4)}
  .task .st.failed{color:var(--err);border-color:rgba(255,107,107,.4)}
  .task .st.printing{color:var(--warn);border-color:rgba(255,180,84,.4)}
  .task .nm{font-size:13px;font-weight:600;word-break:break-all;flex:1}
  .task .meta{font-size:11.5px;color:var(--mut);margin-top:3px}
  .task .err{font-size:11.5px;color:var(--err);margin-top:3px;word-break:break-all}
  .empty{font-size:12.5px;color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
  .tag{font-size:11px;padding:3px 9px;border-radius:8px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  .tag.on{color:var(--ok);border-color:rgba(54,210,160,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="logo">🖨</div>
    <div>
      <h1>SEA2 Web 打印</h1>
      <div class="sub">本机 CUPS 打印 · 支持图片 / PDF · 双面与纸张可选</div>
    </div>
  </div>

  <!-- 上传 -->
  <div class="card">
    <h2>📤 选择文件</h2>
    <p class="desc">支持 PNG / JPG / GIF / WEBP / BMP 与 PDF，单个文件 ≤50MB。选择后自动读取为 base64 上传。</p>
    <div class="drop" id="dropZone">
      <div class="big">点击选择 / 拖拽文件到此处</div>
      <div>支持 image/* 与 application/pdf</div>
      <input type="file" id="fileInput" accept="image/*,application/pdf" style="display:none" />
    </div>
    <div class="file-info" id="fileInfo"></div>
    <div class="row">
      <label class="fld">份数
        <input type="number" id="copies" min="1" max="20" value="1" />
      </label>
      <label class="fld">纸张
        <select id="paper">
          <option value="A4" selected>A4</option>
          <option value="A3">A3</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
        </select>
      </label>
      <span class="chk" style="margin-bottom:9px"><input type="checkbox" id="duplex" /> 双面打印</span>
      <button class="btn" id="printBtn" disabled>提交打印</button>
    </div>
    <div class="note" id="msg"></div>
  </div>

  <!-- 任务状态 -->
  <div class="card">
    <div class="sec-head" style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <h2 style="margin:0">📋 打印任务</h2>
      <span class="tag" id="taskCount">0</span>
      <span style="margin-left:auto"><button class="btn ghost" id="refreshBtn" style="padding:7px 12px;font-size:12px">刷新</button></span>
    </div>
    <p class="desc">任务状态每 3 秒自动刷新：queued（排队）→ printing（打印中）→ done（完成）/ failed（失败）。</p>
    <div id="taskArea"><div class="empty">暂无任务</div></div>
  </div>
</div>

<script src="/webprint.js"></script>
</body>
</html>
